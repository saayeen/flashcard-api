services:
  db:
    image: postgres:15
    container_name: flashcard-db
    environment:
      POSTGRES_DB: flashcard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "3001:5000"
    volumes:
      - pgdata:/var/lib/postgresql/data
# define variables como DB_HOST=db, DB_PORT=5432
  api:
    build: .
    container_name: flashcard-api
    ports:
      - "80:8080"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/flashcard

volumes:
  pgdata:
